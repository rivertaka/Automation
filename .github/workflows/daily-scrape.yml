name: Daily ikyu.com price watch

on:
  schedule:
    # 02:00 UTC = 11:00 JST — runs 1 hour before the Claude scheduled task
    # that reads this data (that task fires at 03:00 UTC / 12:00 JST).
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        run: npm run scrape

      - name: Commit and push results
        run: |
          git config user.name "ikyu-price-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data screenshots
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily ikyu.com price snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
